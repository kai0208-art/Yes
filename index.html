<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PTI 動態全螢幕顯示</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('bg.png') no-repeat center center;
            background-size: contain;
        }

        .mask {
            position: absolute;
            top: 28%;
            left: 10%;
            width: 80%;
            height: 25%;
            background-color: black;
            z-index: 1;
        }

        /* 定義循環變色動畫 */
        @keyframes colorCycle {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }

        .overlay {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 30%; 
            font-family: 'Arial', sans-serif;
            color: #B19CD9; /* 基準色 */
            pointer-events: none;
            z-index: 2;
            
            /* 套用動畫：1秒循環一次，線性速度，無限重複 */
            animation: colorCycle 1s linear infinite;
        }

        #date {
            font-size: 10.5vw;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        #time {
            font-size: 15vw;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        #hint {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            color: rgba(177, 156, 217, 0.3);
            font-size: 3vw;
            z-index: 3;
            font-family: sans-serif;
        }
    </style>
</head>
<body onclick="toggleFullScreen()">

    <div class="container">
        <div class="mask"></div>
        
        <div class="overlay">
            <div id="date">0000/00/00</div>
            <div id="time">00:00:00</div>
        </div>

        <div id="hint">點擊螢幕進入全螢幕模式</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').textContent = `${y}/${m}/${d}`;

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hh}:${mm}:${ss}`;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
                else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
                
                document.getElementById('hint').style.display = 'none';
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                document.getElementById('hint').style.display = 'block';
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
